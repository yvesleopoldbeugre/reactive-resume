name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/yvesleopold98/essor

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Docker Hub, not GHCR: pushing to GHCR from Actions needs Actions minutes, which this
      # account doesn't currently have (billing hold) -- Docker Hub only needs its own token,
      # set as the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Building here (fast CI network/CPU) instead of on the deploy server avoids the slow,
      # unreliable npm registry downloads a constrained server connection would otherwise hit.
      # The server only ever runs `docker compose pull` (see scripts/deploy.sh).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
